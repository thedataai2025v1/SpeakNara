[project]
name = "speaknara-backend"
version = "0.1.0"
description = "AI-powered public speaking practice platform — backend"
requires-python = ">=3.11"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.32"}
pydantic = "^2.0"
httpx = "^0.28"
python-dotenv = "^1.0"
supabase = "^2.9"
openai = "^1.50"
langgraph = "^0.2"
langchain-openai = "^0.2"
python-multipart = "^0.0.18"
yt-dlp = "^2024"
faster-whisper = "^1.1"
pydub = "^0.25"
webvtt-py = "^0.5"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
pytest-cov = "^5.0"
ruff = "^0.8"
mypy = "^1.13"
black = "^24.8"
isort = "^5.13"
playwright = "^1.47"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
